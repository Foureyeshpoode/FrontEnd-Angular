<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>    
    <ion-title>IMDB Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding home-content">
  <div class="section">
    <h2>Trending Now</h2>
    <div class="scroll-row">
      <ion-card *ngFor="let item of trending" class="movie-card" (click)="goToDetails(item.id)">
        <img [src]="'https://image.tmdb.org/t/p/w200' + item.poster_path" />
        <ion-card-content>
          <p>{{ item.title || item.name }}</p>
        </ion-card-content>
      </ion-card>
    </div>
  </div>

  <div class="section">
    <h2>Popular Movies</h2>
    <div class="scroll-row">
      <ion-card *ngFor="let item of popularMovies" class="movie-card" (click)="goToDetails(item.id)">
        <img [src]="'https://image.tmdb.org/t/p/w200' + item.poster_path" />
        <ion-card-content>
          <p>{{ item.title }}</p>
        </ion-card-content>
      </ion-card>
    </div>
  </div>

  <div class="section">
    <h2>Popular TV Shows</h2>
    <div class="scroll-row">
      <ion-card *ngFor="let item of popularTV" class="movie-card" (click)="goToDetails(item.id)">
        <img [src]="'https://image.tmdb.org/t/p/w200' + item.poster_path" />
        <ion-card-content>
          <p>{{ item.name }}</p>
        </ion-card-content>
      </ion-card>
    </div>
  </div>

  <div class="section">
    <h2>Popular Animation</h2>
    <div class="scroll-row">
      <ion-card *ngFor="let item of popularAnimation" class="movie-card" (click)="goToDetails(item.id)">
        <img [src]="'https://image.tmdb.org/t/p/w200' + item.poster_path" />
        <ion-card-content>
          <p>{{ item.title || item.name }}</p>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
